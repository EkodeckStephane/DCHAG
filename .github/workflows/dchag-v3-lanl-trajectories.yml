name: DCHAG v3 LANL trajectory construction

on:
  pull_request:
    branches:
      - dchag-v3
    paths:
      - 'experiments/v3/01_external_datasets/**'
      - '.github/workflows/dchag-v3-lanl-trajectories.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lanl-trajectories:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout exact PR revision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Run frozen trajectory tests
        working-directory: experiments/v3/01_external_datasets
        run: python -m pytest -q test_lanl_adapter.py test_run_lanl_trajectories.py

      - name: Download frozen LANL day-02 sources
        working-directory: experiments/v3/01_external_datasets
        run: |
          curl -L --fail --retry 4 --retry-all-errors --connect-timeout 30 -o wls_day-02.bz2 https://lanl.ma.ic.ac.uk/data/2017/wls/wls_day-02.bz2
          curl -L --fail --retry 4 --retry-all-errors --connect-timeout 30 -o netflow_day-02.bz2 https://lanl.ma.ic.ac.uk/data/2017/netflow/netflow_day-02.bz2

      - name: Verify frozen source identities
        working-directory: experiments/v3/01_external_datasets
        run: |
          echo 'e6faf4c57f688d60403111000787b855604e3c188d1e58a3e020ef5811e32527  wls_day-02.bz2' | sha256sum -c -
          echo '7e1a148ec1828ff829b613e026769f038a9bc699e5f3d85c4652f4058df9f019  netflow_day-02.bz2' | sha256sum -c -

      - name: Build frozen trajectories
        working-directory: experiments/v3/01_external_datasets
        run: |
          python run_lanl_trajectories.py \
            --host wls_day-02.bz2 \
            --network netflow_day-02.bz2 \
            --db lanl_traj.sqlite \
            --result LANL_TRAJECTORY_RESULTS.json \
            --trajectory LANL_TRAJECTORY_300S.csv.gz

      - name: Validate trajectory guardrails
        working-directory: experiments/v3/01_external_datasets
        run: |
          python - <<'PY'
          import json
          r=json.load(open('LANL_TRAJECTORY_RESULTS.json', encoding='utf-8'))
          assert r['status']=='PASS'
          assert r['interval']=={'start':118781,'end':172799}
          assert r['primary_width_seconds']==300
          assert r['guardrails']['attack_or_red_team_labels_read'] is False
          assert r['guardrails']['defensive_intervention_C_inferred'] is False
          assert r['guardrails']['counterfactual_effect_claim'] is False
          assert r['summaries']['300']['active_device_windows']>0
          PY
          sha256sum LANL_TRAJECTORY_RESULTS.json LANL_TRAJECTORY_300S.csv.gz

      - name: Upload aggregate trajectory result
        uses: actions/upload-artifact@v4
        with:
          name: dchag-v3-lanl-trajectory-results
          path: experiments/v3/01_external_datasets/LANL_TRAJECTORY_RESULTS.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload primary 300s trajectory
        uses: actions/upload-artifact@v4
        with:
          name: dchag-v3-lanl-trajectory-300s
          path: experiments/v3/01_external_datasets/LANL_TRAJECTORY_300S.csv.gz
          if-no-files-found: error
          retention-days: 90
