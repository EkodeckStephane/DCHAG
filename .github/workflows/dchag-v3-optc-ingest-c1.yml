name: DCHAG v3 OpTC ingestion C1

on:
  pull_request:
    branches:
      - dchag-v3
    paths:
      - '.github/triggers/dchag-v3-optc-ingest.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  optc-ingest-c1:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout PR revision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install frozen test dependency
        run: python -m pip install --disable-pip-version-check pytest==9.1.1

      - name: Verify frozen protocol and C1 correction files
        run: |
          set -euo pipefail
          test -f experiments/v3/01_external_datasets/OPTC_INGEST_PROTOCOL.md
          test -f experiments/v3/01_external_datasets/OPTC_INGEST_EXECUTION_AMENDMENT.md
          test -f experiments/v3/01_external_datasets/OPTC_INGEST_CORRECTION_C1.md
          python -m py_compile experiments/v3/01_external_datasets/run_optc_ingest.py

      - name: Run frozen mapping and temporal regression tests
        working-directory: experiments/v3/01_external_datasets
        run: |
          set -euo pipefail
          python -m pytest -q test_optc_adapter.py test_run_optc_ingest.py

      - name: Execute immutable OpTC ingestion
        working-directory: experiments/v3/01_external_datasets
        run: |
          set -euo pipefail
          rm -rf /tmp/optc-c1
          mkdir -p /tmp/optc-c1
          python run_optc_ingest.py --output /tmp/optc-c1/OPTC_INGEST_RESULTS.json

      - name: Validate aggregate-only result guardrails
        run: |
          python - <<'PY'
          import json
          p='/tmp/optc-c1/OPTC_INGEST_RESULTS.json'
          r=json.load(open(p))
          assert r['experiment_id']=='V3-OPTC-INGEST-001-C1'
          assert r['parent_protocol_id']=='V3-OPTC-INGEST-001'
          assert r['source']['bytes']==5649857
          assert r['source']['git_blob_sha1']=='25279a41030981ead9bf6134432aa6112429eb82'
          assert not r['red_team_ground_truth_used']
          assert r['records']>0
          assert r['mapping_failures']>=0
          assert set(r['typed_observations']).issubset({'H','P','T'})
          assert sum(r['typed_observations'].values())>0
          assert 'C' not in r['typed_observations']
          assert r['temporal']['valid_timestamp_count']>0
          assert isinstance(r['temporal']['source_order_nondecreasing'], bool)
          print('OPTC_C1_GUARDRAILS=PASS')
          PY

      - name: Freeze execution provenance and hashes
        run: |
          set -euo pipefail
          python -V > /tmp/optc-c1/PYTHON_VERSION.txt 2>&1
          python -m pip freeze > /tmp/optc-c1/SOFTWARE_FREEZE.txt
          git rev-parse HEAD > /tmp/optc-c1/WORKFLOW_HEAD.txt
          cp experiments/v3/01_external_datasets/OPTC_INGEST_PROTOCOL.md /tmp/optc-c1/
          cp experiments/v3/01_external_datasets/OPTC_INGEST_EXECUTION_AMENDMENT.md /tmp/optc-c1/
          cp experiments/v3/01_external_datasets/OPTC_INGEST_CORRECTION_C1.md /tmp/optc-c1/
          (cd /tmp/optc-c1 && find . -type f ! -name 'SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)

      - name: Upload aggregate result only
        uses: actions/upload-artifact@v4
        with:
          name: dchag-v3-optc-ingest-c1-results
          path: /tmp/optc-c1/
          retention-days: 90
          if-no-files-found: error
