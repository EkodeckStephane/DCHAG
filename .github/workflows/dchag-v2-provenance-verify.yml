name: DCHAG hardened v2 provenance verification

on:
  pull_request:
    branches:
      - dchag-v3
    paths:
      - 'provenance/v2_hardened/**'
      - 'v2_provenance/**'
      - '.github/workflows/dchag-v2-provenance-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-v2-provenance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR revision
        uses: actions/checkout@v4

      - name: Verify recovered source SHA-256 identities
        shell: bash
        run: |
          set -euo pipefail
          check() {
            expected="$1"; path="$2"
            actual="$(sha256sum "$path" | awk '{print $1}')"
            echo "$actual  $path"
            test "$actual" = "$expected"
          }
          check a3310b65d59b72cc0ee5a9c09f5b4909e75a84fc37072cc5b230cc438120ce09 provenance/v2_hardened/adversarial_validation/common.py
          check c3eed21e3606cb71c55e4c954c9dd8bcb9462e2df0dd58845da98e56800bfba7 provenance/v2_hardened/adversarial_validation/estimate_validation_v2.py
          check d67b74b58a58c0a35c4beb5df7576129b0841858ea04b82a95d5bc0309dbc473 v2_provenance/adversarial_validation/generate_validation_v2.py
          check 32f2f427a430680a2957378d63c866ef74f21e62726174e04815dc84bf909037 v2_provenance/adversarial_validation/score_validation_v2.py
          check c689ad1c68a4c7691d25a98561cdc7fc852a4ec2a49fb295fe920eaa83c1d779 v2_provenance/validation_v2/FROZEN_HYPERPARAMETERS.json
          check f8d8e53fb5f0c901af89e8f1c880cc22568bfa6fc029b77edcd3dfd8f1ddfe9d v2_provenance/validation_v2/FROZEN_PROTOCOL_v2.md
          check 681244f3a102816231bfef37018f8de4d6f88165db4cd815512bb295bc5d1918 v2_provenance/validation_v2/PROTOCOL_AMENDMENT_v2_1.md

      - name: Verify provenance manifest and amendment chronology
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest=json.loads(Path('v2_provenance/SNAPSHOT_MANIFEST.json').read_text())
          assert manifest['source_snapshot_sha256']=='d821d3f6e5a6f73efd7935f0cc2223f55e029b1730edb1fbfd8bfc2d0b7dace3'

          hp=json.loads(Path('v2_provenance/validation_v2/FROZEN_HYPERPARAMETERS.json').read_text())
          assert hp['max_parents']==10
          assert hp['screening_C']==0.05
          assert hp['local_model_C']==0.7
          assert hp['development_caps']==[6,8,10]

          protocol=Path('v2_provenance/validation_v2/FROZEN_PROTOCOL_v2.md').read_text()
          amendment=Path('v2_provenance/validation_v2/PROTOCOL_AMENDMENT_v2_1.md').read_text()
          assert 'among {4, 6}' in protocol
          assert 'from 6, 8 and 10' in amendment
          assert 'cap is now frozen at 10' in amendment
          assert 'before generation of any confirmatory or latent-sensitivity observations' in amendment

          estimator=Path('provenance/v2_hardened/adversarial_validation/estimate_validation_v2.py').read_text()
          assert 'penalty="l1",C=.05' in estimator
          assert 'LogisticRegression(C=.7' in estimator
          assert 'HistGradientBoostingClassifier' in estimator
          print('PROVENANCE_SEMANTIC_CHECK=PASS')
          PY

      - name: Syntax-check archived Python sources
        run: |
          python -m py_compile \
            provenance/v2_hardened/adversarial_validation/common.py \
            provenance/v2_hardened/adversarial_validation/estimate_validation_v2.py \
            v2_provenance/adversarial_validation/generate_validation_v2.py \
            v2_provenance/adversarial_validation/score_validation_v2.py
